  <style>

    button, select {
      padding: 7px 11px;
      border: 1px solid #ccc;
      border-radius: 8px;

      user-select: none;

    button:hover, select:hover { background: #efefef; }

    #app_popupmenu_top_1 { pointer-events: none; }
    #app_popupmenu_top_1[style*="display: block"] { pointer-events: auto; }

    .viewerHeader {
      width: 900px;

      display: flex;

      pointer-events: auto;

    }

    .viewerHeader h2 {
      margin: 0;

    .viewerSwitch {
      position: relative;
      z-index: 2147483647;
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      align-items: center;
      padding: 8px 13px;
      border: 1px solid #bfc5ca;
      border-radius: 8px;
      background: #f8f8f8;
      color: #222;
      text-decoration: none;
      font-size: 14px;
      font-family: Arial, sans-serif;
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
    }

    }
  </style>
</head>

<body>
  <div class="container">
    <div class="viewerHeader">
      <h2>Bile acids – interactive 3D</h2>
      <a
        class="viewerSwitch"
        href="./index.html?v=20260612-7"
      >
        Open Mixed micelle3D
      </a>
    </div>

    <div class="viewerFrame" id="viewerFrame">
      <script>
        var VIEW_W = 900;
        var VIEW_H = 520;

        window.MOLS = {
          "CA (cholic acid)":                          "CA_freeacid_MM2.sdf",
          "CDCA (chenodeoxycholic acid)":              "CDCA_freeacid_MM2.sdf",
          "DCA (deoxycholic acid)":                    "DCA_freeacid_MM2.sdf",
          "GCA (glycocholic acid)":                    "GCA_freeacid_MM2.sdf",
          "TCA (taurocholic acid)":                    "TCA_freeacid_MM2.sdf",
          "LCA (lithocholic acid)":                    "LCA_freeacid_MM2.sdf",
          "UDCA (ursodeoxycholic acid)":               "UDCA_freeacid_MM2.sdf",
          "OCA (obeticholic acid)":                    "OCA_freeacid_MM2.sdf",

          "GCDCA (glycochenodeoxycholic acid)":        "GCDCA_freeacid_MM2.sdf",
          "TCDCA (taurochenodeoxycholic acid)":        "TCDCA_freeacid_MM2.sdf",
          "GDCA (glycodeoxycholic acid)":              "GDCA_freeacid_MM2.sdf",
          "TDCA (taurodeoxycholic acid)":              "TDCA_freeacid_MM2.sdf",
          "GLCA (glycolithocholic acid)":              "GLCA_freeacid_MM2.sdf",
          "TLCA (taurolithocholic acid)":              "TLCA_freeacid_MM2.sdf",
          "GOCA (glyco-obeticholic acid)":             "GOCA_freeacid_MM2.sdf",
          "TOCA (tauro-obeticholic acid)":             "TOCA_freeacid_MM2.sdf",
          "GUDCA (glycoursodeoxycholic acid)":         "GUDCA_freeacid_MM2.sdf",
          "TUDCA (tauroursodeoxycholic acid)":         "TUDCA_freeacid_MM2.sdf",

          "Sodium glycochenodeoxycholate":             "GCDCA_salt_MM2.sdf",
          "Sodium taurochenodeoxycholate":             "TCDCA_salt_MM2.sdf",
          "Sodium glycodeoxycholate":                  "GDCA_salt_MM2.sdf",
          "Sodium taurodeoxycholate":                  "TDCA_salt_MM2.sdf",
          "Sodium glycolithocholate":                  "GLCA_salt_MM2.sdf",
          "Sodium taurolithocholate":                  "TLCA_salt_MM2.sdf",
          "Sodium glyco-obeticholate":                 "GOCA_salt_MM2.sdf",
          "Sodium tauro-obeticholate":                 "TOCA_salt_MM2.sdf",
          "Sodium glycoursodeoxycholate":              "GUDCA_salt_MM2.sdf",
          "Sodium tauroursodeoxycholate":              "TUDCA_salt_MM2.sdf",
          "Sodium glycocholate":                       "GCA_salt_MM2.sdf",
          "Sodium taurocholate":                       "TCA_salt_MM2.sdf"
        };

        window.currentLabel = "CA (cholic acid)";
        window.currentFile  = window.MOLS[window.currentLabel];
        window.hOn = true;

        window.Info = {
          width: VIEW_W,
          height: VIEW_H,
          use: "HTML5",
          j2sPath: "jsmol/j2s",
          disableJ2SLoadMonitor: true,
          disableInitialConsole: true,
          script:
            "load " + window.currentFile + ";" +
            "set background white;" +
            "set antialiasDisplay true;" +
            "select all; wireframe 0.12; spacefill 23%;" +
            "zoomto 1.2 {*} ; rotate best; center;"
        };

        window.app = Jmol.getApplet("app", window.Info);
        document.write(Jmol.getAppletHtml(window.app));
      </script>
    </div>

    <div class="toolbar">
      <span class="label">Molecule:</span>
      <select id="molSelect" onchange="loadSelectedMolecule()">
        <option>CA (cholic acid)</option>
        <option>CDCA (chenodeoxycholic acid)</option>
        <option>DCA (deoxycholic acid)</option>
        <option>GCA (glycocholic acid)</option>
        <option>TCA (taurocholic acid)</option>
        <option>LCA (lithocholic acid)</option>
        <option>UDCA (ursodeoxycholic acid)</option>
        <option>OCA (obeticholic acid)</option>

        <option>GCDCA (glycochenodeoxycholic acid)</option>
        <option>TCDCA (taurochenodeoxycholic acid)</option>
        <option>GDCA (glycodeoxycholic acid)</option>
        <option>TDCA (taurodeoxycholic acid)</option>
        <option>GLCA (glycolithocholic acid)</option>
        <option>TLCA (taurolithocholic acid)</option>
        <option>GOCA (glyco-obeticholic acid)</option>
        <option>TOCA (tauro-obeticholic acid)</option>
        <option>GUDCA (glycoursodeoxycholic acid)</option>
        <option>TUDCA (tauroursodeoxycholic acid)</option>

        <option>Sodium glycochenodeoxycholate</option>
        <option>Sodium taurochenodeoxycholate</option>
        <option>Sodium glycodeoxycholate</option>
        <option>Sodium taurodeoxycholate</option>
        <option>Sodium glycolithocholate</option>
        <option>Sodium taurolithocholate</option>
        <option>Sodium glyco-obeticholate</option>
        <option>Sodium tauro-obeticholate</option>
        <option>Sodium glycoursodeoxycholate</option>
        <option>Sodium tauroursodeoxycholate</option>
        <option>Sodium glycocholate</option>
        <option>Sodium taurocholate</option>
      </select>

      <button type="button" onclick="Jmol.script(window.app,'select all; spacefill 23%; wireframe 0.12;')">Ball &amp; Stick</button>
      <button type="button" onclick="Jmol.script(window.app,'select all; spacefill off; wireframe 0.20;')">Sticks</button>
      <button type="button" onclick="Jmol.script(window.app,'select all; spacefill 100%; wireframe off;')">Spacefill</button>

      <button type="button" id="hBtn" onclick="toggleHydrogens()">Hydrogens: ON</button>

      <button type="button" onclick="resetView()">Reset view</button>

      <button type="button" onclick="exportPNG()">Snapshot / Export PNG</button>
</div>
  </div>

  <script>
    function applyCommonView() {
      return (
        "set background white;" +
        "set antialiasDisplay true;" +
        "select all; wireframe 0.12; spacefill 23;" +
        "zoomto 1.2 {*} ; rotate best; center;" +
        (window.hOn ? "set showHydrogens true;" : "set showHydrogens false;")
      );
    }

    function loadSelectedMolecule() {
      var label = document.getElementById("molSelect").value;
      window.currentLabel = label;
      window.currentFile = window.MOLS[label];
      Jmol.script(window.app, "load " + window.currentFile + ";" + applyCommonView());
    }

    function toggleHydrogens() {
      window.hOn = !window.hOn;
      Jmol.script(window.app, window.hOn ? "set showHydrogens true;" : "set showHydrogens false;");
      document.getElementById("hBtn").innerText = "Hydrogens: " + (window.hOn ? "ON" : "OFF");
    }

    function resetView() {
      Jmol.script(window.app, "load " + window.currentFile + ";" + applyCommonView());
    }

    function exportPNG() {
      Jmol.script(window.app, "refresh;");
      var s = Jmol.getPropertyAsString(window.app, "image");

      if (!s || typeof s !== "string") {
        alert("Snapshot export failed (empty response). Try again after rotating/zooming once.");
        return;
      }

      var dataUrl = s.trim();
      if (!dataUrl.startsWith("data:image")) {
        dataUrl = "data:image/png;base64," + dataUrl;
      }

      if (!dataUrl.startsWith("data:image/png;base64,")) {
        alert("Snapshot export returned an unexpected format.");
        return;
      }

      var safeName = (window.currentLabel || "molecule").replace(/[^a-z0-9]+/gi, "_");
      var filename = safeName + "_snapshot.png";

      var a = document.createElement("a");
      a.href = dataUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
</body>
</html>
